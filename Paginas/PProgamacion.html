<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Imagenes/Logo.png" type="image/png">
    <title>Programación | Gamavisión</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../Css/DInicio.css">

    <!-- CSS PROGRAMACIÓN -->
    <link rel="stylesheet" href="../Css/DProgamacion.css">
</head>
<body>
    <!-- HEADER -->
	<div id="header"></div>

    <!-- ===== CONTENIDO PROGRAMACIÓN / EN VIVO ===== -->

    <main class="programacion-page">

        <section class="programacion-en-vivo">

            <!-- =================================================
                COLUMNA IZQUIERDA
            ================================================== -->

            <aside class="programacion-info">

                <!-- ================= EN VIVO ================= -->

                <div class="bloque-vivo">

                    <div class="titulo-seccion">
                        <span class="punto-rojo"></span>

                        <h2>
                            EN VIVO
                        </h2>
                    </div>

                    <div class="separador"></div>


                    <!-- RELOJ -->

                    <div class="reloj-container">

                        <div
                            id="reloj-hora"
                            class="reloj">

                            <span class="aguja-hora"></span>

                            <span class="aguja-minuto"></span>

                        </div>

                        <p>
                            Hora de Ecuador GMT-5
                        </p>

                    </div>

                </div>


                <!-- =================================================
                    ESTÁS VIENDO
                ================================================== -->

                <div class="bloque-programa-actual">

                    <div class="titulo-seccion">

                        <span class="punto-rojo"></span>

                        <h2>
                            ESTÁS VIENDO
                        </h2>

                    </div>

                    <div class="separador"></div>


                    <div class="programa-actual">

                        <!-- NOMBRE DEL PROGRAMA -->

                        <span class="programa-label">

                            <span id="programa-actual">
                                NOMBRE DEL PROGRAMA
                            </span>

                        </span>


                        <!-- HORARIO -->

                        <span id="hora-programa-actual">
                            HORA
                        </span>


                        <!-- BARRA DE PROGRESO -->

                        <div class="progreso-container">

                            <div
                                id="barra-progreso"
                                class="barra-progreso">
                            </div>

                            <span id="porcentaje-progreso">
                                0%
                            </span>

                        </div>

                    </div>

                </div>


                <!-- =================================================
                    A CONTINUACIÓN
                ================================================== -->

                <div class="bloque-continuacion">

                    <div class="titulo-seccion">

                        <h2>
                            A CONTINUACIÓN
                        </h2>

                    </div>

                    <div class="separador"></div>


                    <!-- SIGUIENTE -->

                    <article class="programa-siguiente">

                        <span id="siguiente-hora-1">
                            HORA
                        </span>

                        <strong id="siguiente-programa-1">
                            NOMBRE DEL PROGRAMA
                        </strong>

                    </article>


                    <!-- SEGUNDO SIGUIENTE -->

                    <article class="programa-siguiente">

                        <span id="siguiente-hora-2">
                            HORA
                        </span>

                        <strong id="siguiente-programa-2">
                            NOMBRE DEL PROGRAMA
                        </strong>

                    </article>

                </div>


                <!-- =================================================
                    ENLACE A PROGRAMACIÓN COMPLETA
                ================================================== -->

                <div class="programacion-completa">

                    <a href="PProgamacion.html">
                        VER PROGRAMACIÓN DE HOY
                        <span>--&gt;</span>
                    </a>

                </div>

            </aside>


            <!-- =================================================
                COLUMNA DERECHA / TRANSMISIÓN
            ================================================== -->

            <section class="reproductor-en-vivo">

                <div class="video-container">

                    <video
                        id="live-stream"
                        class="video-en-vivo"
                        playsinline
                        muted
                        autoplay
                        controls>
                    </video>

                </div>

            </section>

        </section>

    </main>

	<!-- PIE DE PÁGINA -->
	<div id="footer"></div>

    <!-- JS GLOBAL -->
    <script src="../Js/script.js"></script>

    <!-- JS PROGRAMACION -->
    <script src="../Js/programacion.js"></script>
    <script src="../Js/programacion-horario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>
</html>
